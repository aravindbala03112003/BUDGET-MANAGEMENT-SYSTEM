<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expenditure Bill</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"/>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet"/>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="navigation.js" defer></script>
  <script src="expenditure.js" defer></script>
</head>
<body>
  <nav class="navbar"> 
    <div class="nav-brand">
      <img src="logo.png" alt="Puducherry Technological University Logo" class="nav-logo"/>
      <div class="nav-brand-text">PUDUCHERRY TECHNOLOGICAL UNIVERSITY</div>
    </div>
    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
     
      <li><a href="expenditure.html" class="nav-link active"><i class="fas fa-file-invoice-dollar"></i> Expenditure Bill</a></li>
      <li><a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a></li>
      <li><a href="view.html" class="nav-link"><i class="fas fa-eye"></i> View</a></li>
    </ul>
    <div class="nav-toggle">☰</div>
  </nav>

  <main class="container">
    <h1>Expenditure Bill</h1>

    <div class="slide" id="expenditure-slide">
      <div class="card">
        <!-- Hidden goal ID field -->
        <input type="hidden" id="goal-id"/>

        <div class="form-group">
          <label for="goal-year">Select Goal Year:</label>
          <select id="goal-year" class="searchable-select">
            <option value="">--Select Year--</option>
          </select>
        </div>

        <div class="form-group">
          <label for="department">Select Department:</label>
          <select id="department" class="searchable-select">
            <option value="">--Select Department--</option>
          </select>
        </div>

        <div class="form-group">
          <label for="type">Expenditure Type:</label>
          <select id="type">
            <option value="Consumable">Consumable</option>
            <option value="Non-Consumable">Non-Consumable</option>
          </select>
        </div>

        <div class="form-group">
            <label for="main-head">Select Main Head:</label>
            <select id="main-head" class="searchable-select" onchange="loadSubHeads()">
              <option value="">--Select Main Head--</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="sub-head">Select Sub Head:</label>
            <select id="sub-head" class="searchable-select">
              <option value="">--Select Sub Head--</option>
            </select>
          </div>
          

        <div class="form-group">
          <label for="amount">Amount:</label>
          <input type="number" id="amount" required min="0" />
        </div>

        <div class="form-group">
          <label for="date">Date:</label>
          <input type="date" id="date" required />
        </div>

        <div class="form-group">
          <label for="description">Description:</label>
          <textarea id="description" required></textarea>
        </div>

        <div class="form-group">
          <label for="cheque-number">Cheque Number:</label>
          <input type="text" id="cheque-number" required />
        </div>

        <button onclick="addExpenditure()">Generate Bill</button>
      </div>
    </div>
  </main>
</body>
</html>
