<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Allocation - FinancePro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="navigation.js" defer></script>
    <script src="allocation.js" defer></script>
</head>
<body>
    <nav class="navbar"> 
        <div class="nav-brand">
            <img src="logo.png" alt="Puducherry Technological University Logo" class="nav-logo">
            <div class="nav-brand-text">PUDUCHERRY TECHNOLOGICAL UNIVERSITY</div>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
           
            <li><a href="expenditure.html" class="nav-link"><i class="fas fa-file-invoice-dollar"></i> Expenditure Bill</a></li>
            <li><a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a></li>
            <li><a href="view.html" class="nav-link"><i class="fas fa-eye"></i> View</a></li>
        </ul>
        <div class="nav-toggle">☰</div>
    </nav>
    <main class="container">
        <h1>Budget Allocation</h1>
        <div class="slide" id="goal-selection-slide">
            <div class="card">
                <div class="form-group">
                    <label for="goal-year">Select Goal Year:</label>
                    <select id="goal-year" class="searchable-select">
                        <option value="">--Select Year--</option>
                    </select>
                </div>
               
            </div>
        </div>
        <div class="slide" id="create-goal-slide" style="display: none;">
            <div class="card">
                <h2>Create New Goal</h2>
                <div class="form-group">
                    <label for="year">Year:</label>
                    <input type="number" id="year" required min="2000" max="2100">
                </div>
                <div class="form-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" required min="0">
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" required></textarea>
                </div>
                <button onclick="addGoal()">Add Goal</button>
            </div>
        </div>
        <div class="slide" id="allocation-section-slide" style="display: none;">
            <div class="card">
                <h2>Allocate Budget</h2>
                <div class="form-group">
                    <label for="main-head-name">Main Head Name:</label>
                    <input type="text" id="main-head-name" required>
                    <label for="main-head-amount">Main Head Amount:</label>
                    <input type="number" id="main-head-amount" required min="0">
                    <button onclick="addMainHead()">Add Main Head</button>
                </div>
                <div class="remaining-amount">Remaining Goal Amount: <span id="remaining-goal-value">0</span></div>
                <div class="form-group">
                    <label for="main-head-select">Select Main Head:</label>
                    <select id="main-head-select" onchange="loadMainHeadRemaining()">
                        <option value="">--Select Main Head--</option>
                    </select>
                    <div class="remaining-amount">Remaining Main Head Amount: <span id="remaining-main-head-value">0</span></div>
                    <label for="sub-head-amount">Sub Head Amount:</label>
                    <input type="number" id="sub-head-amount" required min="0">
                    <label for="sub-head-description">Description:</label>
                    <textarea id="sub-head-description" required></textarea>
                    <button onclick="addSubHead()">Add Sub Head</button>
                </div>
                <div class="remaining-amount">Remaining Sub Head Amount: <span id="remaining-sub-head-value">0</span></div>
                <button onclick="handleSubmit()">Submit</button>

            </div>
        </div>
    </main>
</body>
</html>
