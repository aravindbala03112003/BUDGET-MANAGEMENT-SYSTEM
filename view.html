<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Budget - FinancePro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="navigation.js" defer></script>
    <script src="view.js" defer></script>
</head>
<body>
    <nav class="navbar"> 
        <div class="nav-brand">
            <img src="logo.png" alt="Puducherry Technological University Logo" class="nav-logo">
            <div class="nav-brand-text">PUDUCHERRY TECHNOLOGICAL UNIVERSITY</div>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a></li>
           
            <li><a href="expenditure.html" class="nav-link"><i class="fas fa-file-invoice-dollar"></i> Expenditure Bill</a></li>
            <li><a href="reports.html" class="nav-link"><i class="fas fa-chart-bar"></i> Reports</a></li>
            <li><a href="view.html" class="nav-link active"><i class="fas fa-eye"></i> View</a></li>
        </ul>
        <div class="nav-toggle">☰</div>
    </nav>
    <main class="container">
        <h1>View Budget Details</h1>
        <div class="slide" id="view-slide">
            <div class="card">
                <div class="form-group">
                    <label for="goal-year">Select Goal Year:</label>
                    <select id="goal-year" class="searchable-select" onchange="loadBudgetDetails()">
                        <option value="">--Select Year--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="department-filter">Filter by Department:</label>
                    <select id="department-filter" class="searchable-select" onchange="loadReports()">
                        <option value="">All Departments</option>
                    </select>
                </div>
                <div id="report-table"></div>
                <button onclick="window.location.href='reports.html'">Go to Reports</button>
            </div>
        </div>
    </main>
</body>
</html>
